[project]
name = "quixote-fanchat"
version = "0.1.0"
description = "Un pequeño RAG sobre El Quijote para aprender observabilidad con MLflow."
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.67,<2",
    "mlflow>=3.18,<4",
    "openai>=2.54,<3",
    "pypdf>=6.21,<7",
    "numpy>=2.5,<3",
    "langchain-text-splitters>=1.1,<2",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.14,<3",
    "pandas>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
