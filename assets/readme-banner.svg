<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title description">
  <title id="title">Quixote Fan Chat: un chatbot con RAG y MLflow</title>
  <desc id="description">Un chat sobre El Quijote recupera fragmentos de un PDF y registra su recorrido en MLflow. Ilustración del flujo Chat, RAG y Observabilidad.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f7faf8"/><stop offset="1" stop-color="#edf3f0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#6d8d7b" stroke-width="2"/></marker>
  </defs>
  <rect x="1" y="1" width="1598" height="538" rx="28" fill="url(#background)" stroke="#dce6df" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="62" fill="#53695d" font-size="20" letter-spacing="4">QUIXOTE FAN CHAT</text>
    <text x="48" y="142" fill="#213b2d" font-size="64" font-weight="700" letter-spacing="-2">Chat con RAG y MLflow</text>
    <text x="50" y="192" fill="#5f7166" font-size="25">El Quijote como fuente. OpenAI como voz. Cada respuesta deja una traza.</text>
