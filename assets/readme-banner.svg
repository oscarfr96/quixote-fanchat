      <circle cx="102" cy="65" r="5" fill="#6d8d7b"/>
      <path d="M22 140q40-2 70 17 29-17 69-15v41q-39-2-69 15-32-18-70-17Z" fill="#fff"/><path d="M92 157v41"/>
      <path d="M33 154q26 2 48 13m-48-1q26 2 48 13m23-12q22-12 44-12m-44 23q22-12 44-12" stroke="#b2c4b8" stroke-width="2"/>
    </g>
    <g fill="#fff" stroke="#d7e3db" stroke-width="2">
      <rect x="48" y="240" width="456" height="252" rx="18"/>
      <rect x="572" y="240" width="456" height="252" rx="18"/>
      <rect x="1096" y="240" width="456" height="252" rx="18"/>
