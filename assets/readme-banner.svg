    <g fill="#264433" font-size="25" font-weight="700"><text x="74" y="284">01 · Chat</text><text x="598" y="284">02 · RAG sobre el PDF</text><text x="1122" y="284">03 · MLflow</text></g>
    <rect x="74" y="306" width="404" height="54" rx="12" fill="#eef3f0"/>
    <text x="91" y="340" fill="#344c3e" font-size="22">¿Quién es Sancho Panza?</text>
    <text x="78" y="398" fill="#53695d" font-size="22">El fiel escudero de don Quijote.</text>
    <text x="78" y="454" fill="#6d8d7b" font-size="18">Respuesta con páginas y fuentes</text>
    <g transform="translate(598 311)" fill="#f5f8f6" stroke="#9eb7a7" stroke-width="2"><rect x="0" y="7" width="52" height="61" rx="5"/><rect x="11" y="0" width="52" height="61" rx="5"/><path d="M23 16h26m-26 13h26m-26 13h19"/></g>
